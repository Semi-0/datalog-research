name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.LAIN_READ_TOKEN }}
      JAVA_TOOL_OPTIONS: -Xmx4g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.4.1618
      - name: Authenticate private cross-repository dependencies
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set LAIN_READ_TOKEN with read-only access to both Lain repositories.'
            exit 1
          fi
          gh api repos/Semi-0/lain-editor/contents/contracts/deps.edn --jq .path
          gh auth setup-git --hostname github.com
          git ls-remote https://github.com/Semi-0/lain-editor.git HEAD
      - name: Backend Clojure suite
        run: clojure -M:test
      - name: Pinned editor ClojureScript contract suite
        run: |
          clojure -M:editor/cljs-test
          node target/lain-editor/tests.js
      - name: Rust suite
        run: cargo test --locked --manifest-path leapfrog-rs/Cargo.toml
      - name: Pull deployment gates and rollback tests
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
